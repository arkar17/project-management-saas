# Single-host production stack (see docs/DEPLOYMENT.md). Secrets come from .env.production,
# which is never committed. Only Caddy publishes ports; Postgres stays on the internal network.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      retries: 10

  # One-off: docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build: { context: ., target: app }
    profiles: [ops]
    env_file: .env.production
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., target: app }
    restart: unless-stopped
    env_file: .env.production
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    build: { context: ., target: app }
    restart: unless-stopped
    env_file: .env.production
    command: ['node', 'apps/worker/dist/main.js']
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
