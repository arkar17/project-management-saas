# Local development services only. Credentials here are local-only placeholders.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm_local_only
      POSTGRES_DB: pm_dev
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pm -d pm_dev']
      interval: 5s
      retries: 10

  # Local mail sink (SRS §10 development default). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']

  # Local S3-compatible store for attachments (ADR-004, used from G3).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: pm_local
      MINIO_ROOT_PASSWORD: pm_local_only
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
