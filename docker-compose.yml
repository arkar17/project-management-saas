# Local development services only. Credentials here are local-only placeholders.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm_local_only
      POSTGRES_DB: pm_dev
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pm -d pm_dev']
      interval: 5s
      retries: 10

  # Local mail sink (SRS §10 development default). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']

  # Local S3-compatible store for attachments (ADR-004). Bound to loopback only; the bucket has
  # no anonymous policy, so objects are reachable only through 5-minute signed URLs.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: pm_local
      MINIO_ROOT_PASSWORD: pm_local_only
      # Browsers PUT/GET signed URLs directly; only the web origin may do so cross-origin.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Creates the private attachment bucket once MinIO is up.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 pm_local pm_local_only &&
      mc mb --ignore-existing local/pm-attachments &&
      mc anonymous set none local/pm-attachments"

volumes:
  pgdata:
  miniodata:
